name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install project tools
        uses: jdx/mise-action@v4

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-${{ hashFiles('.mise.toml', 'Cargo.lock') }}
          restore-keys: |
            gates-

      - name: Run project gates
        run: mise run check

      - name: Run database integration tests
        run: mise run test-db

      - name: Stop database services
        if: always()
        run: mise exec -- just db-down

  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      # Core 5 / bridge 6 deliberately change the evidence contract.
      - run: mise exec -- scripts/check-public-api.sh major

  relation-consumer:
    uses: ./.github/workflows/relation-consumer.yml
    with:
      keepsake_ref: fe87616ad4661bd17981b64eeb680e11f2191f83
      carrier_ref: 5a1803935c868359e3e41d783bc29dd9ab1c0212
