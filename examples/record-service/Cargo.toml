[package]
name = "gatekeep-example-record-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Synthetic record access with real SQLite rows and durable audit"

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["http1"] }
dovecote.workspace = true
dovecote-sqlx-sqlite.workspace = true
gatekeep = { path = "../../crates/gatekeep", version = "5.0.0" }
gatekeep-sqlx = { path = "../../crates/gatekeep-sqlx", version = "5.0.0", default-features = false, features = [
  "sqlite",
] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
time.workspace = true
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
tower.workspace = true

[lints]
workspace = true

[[bench]]
name = "data_access"
harness = false
