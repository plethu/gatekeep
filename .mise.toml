[tools]
rust = { version = "1.96.0", profile = "minimal", components = [
  "clippy",
  "rustfmt",
] }
just = "1.53.0"
taplo = "0.10.0"
typos = "1.47.2"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-deny" = "0.20.2"

"cargo:mdbook" = "0.5.4"
"cargo:cargo-semver-checks" = "0.50.0"

[env]
RUST_BACKTRACE = "1"
